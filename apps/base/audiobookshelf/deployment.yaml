apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf

  template:
    metadata:
      labels:
        app: audiobookshelf

    spec:
      containers:
      - image: ghcr.io/advplyr/audiobookshelf:2.37.1
        name: audiobookshelf

        ports:
          - containerPort: 3005
            protocol: TCP

        envFrom:
          - configMapRef:
              name: abs-config

      restartPolicy: Always
