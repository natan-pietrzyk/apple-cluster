apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: audiobookshelf
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: audiobookshelf
          image: advplyr/audiobookshelf:2.37.1
          ports:
            - containerPort: 3005

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - mountPath: /etc/audiobookshelf/data
              name: audiobookshelf-data
      volumes:
        - name: audiobookshelf-data
          persistentVolumeClaim:
            claimName: audiobookshelf-data-pvc
